<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="grokbot.dev">
  <!-- Regenerated 2026-08-22 from the header mark (MarkGlyph): 36-grid, tilted capsule
       eyes rotate(38), six ink dots plus the gold accent dot at (18,27), on a rounded
       brand-paper tile so it stays legible in a browser tab. Brand hexes from tokens.css. -->
  <rect width="40" height="40" rx="8" fill="#F7F7F5"/>
  <g transform="translate(2 2)">
    <g fill="#0B0B0C">
      <rect x="6.75" y="3.5" width="4.5" height="11" rx="2.25" transform="rotate(38 9 9)"/>
      <rect x="15.75" y="3.5" width="4.5" height="11" rx="2.25" transform="rotate(38 18 9)"/>
      <circle cx="27" cy="9" r="3.25"/>
      <circle cx="9" cy="18" r="3.25"/>
      <circle cx="18" cy="18" r="3.25"/>
      <circle cx="27" cy="18" r="3.25"/>
      <circle cx="9" cy="27" r="3.25"/>
      <circle cx="27" cy="27" r="3.25"/>
    </g>
    <circle cx="18" cy="27" r="3.25" fill="#8C7A5C"/>
  </g>
</svg>
