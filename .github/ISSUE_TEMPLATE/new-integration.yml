name: New integration (controlled vocabulary)
description: Propose a new integration/tool for the controlled vocabulary (maintainer change).
title: "[integration] "
labels: ["vocabulary", "needs-maintainer"]
body:
  - type: input
    id: name
    attributes: { label: Canonical name, placeholder: "e.g. Linear" }
    validations: { required: true }
  - type: input
    id: url
    attributes: { label: Official URL }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why add it?, description: "Which plugin/use case needs it, and any aliases people use." }
    validations: { required: true }
