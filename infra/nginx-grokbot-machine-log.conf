# grokbot.dev — machine-facing access-log format for the JSON API + feeds (bot-usage metric).
# http context (conf.d). Defining a format is inert until a location references it, so this
# touches no other vhost. §metrics: cannot be backfilled, so it goes in at cutover.
log_format grokbot_machine '$time_iso8601 $remote_addr "$request" $status $body_bytes_sent "$http_user_agent" "$http_referer" rt=$request_time';
