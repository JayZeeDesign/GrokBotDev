# AUTHOR-ONLY production nginx snippet for P1 upvotes. DO NOT APPLY from this branch.
# Operator applies after review on crhq-products, alongside Postgres + votes-api env/secrets.

# Place in nginx http{} context (e.g. conf.d) once:
limit_req_zone $binary_remote_addr zone=grokbot_votes_identity:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=grokbot_votes_casts:10m rate=30r/m;

# Place inside the grokbot.dev server{} before the generic .json and / locations.
# The static JSON API keeps serving via the existing \.json location; only these exact dynamic
# vote endpoints proxy to the same-origin votes API.
location = /api/v1/identity {
    include /etc/nginx/snippets/grokbot-security-headers.conf;
    limit_req zone=grokbot_votes_identity burst=3 nodelay;
    proxy_pass http://127.0.0.1:4391;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/votes {
    include /etc/nginx/snippets/grokbot-security-headers.conf;
    limit_req zone=grokbot_votes_casts burst=30 nodelay;
    proxy_pass http://127.0.0.1:4391;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/v1/votes/ {
    include /etc/nginx/snippets/grokbot-security-headers.conf;
    proxy_pass http://127.0.0.1:4391;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/health {
    include /etc/nginx/snippets/grokbot-security-headers.conf;
    proxy_pass http://127.0.0.1:4391;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
