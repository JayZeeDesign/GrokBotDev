# grokbot.dev — PRODUCTION. Full static build served from dist-full, behind Cloudflare (Full).
# 80 -> 301 https. Machine JSON + feeds get public CORS and a machine access log. §10.7 security
# headers are re-included in every location that sets its own add_header (nginx add_header does
# not inherit into such a location). TLS reuses the generatespecs LE cert — CF Full does not
# validate the origin cert name (upgrade to a grokbot.dev cert later, no behaviour change).
server {
    listen 80;
    listen [::]:80;
    server_name grokbot.dev www.grokbot.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grokbot.dev www.grokbot.dev;

    ssl_certificate     /etc/letsencrypt/live/generatespecs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/generatespecs.com/privkey.pem;

    root /opt/projects/user/grokbot/current;
    index index.html;

    # Cloudflare-resolved client IP — scoped to THIS vhost so the machine log records the real
    # bot IP, not a CF edge IP. No global nginx change.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/snippets/grokbot-security-headers.conf;

    # Newsletter waitlist (dynamic) -> services process on :4390.
    location = /api/waitlist {
        include /etc/nginx/snippets/grokbot-security-headers.conf;
        proxy_pass http://127.0.0.1:4390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Machine data: every JSON file (the /api/v1 tree + top-level lists) — public CORS, short cache.
    location ~* \.json$ {
        include /etc/nginx/snippets/grokbot-security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=300" always;
        access_log /var/log/nginx/grokbot-machine.log grokbot_machine;
        default_type application/json;
        try_files $uri =404;
    }

    # Feeds + agent text (rss.xml, sitemap*.xml, llms.txt, robots.txt) — CORS + machine log.
    location ~* \.(xml|txt)$ {
        include /etc/nginx/snippets/grokbot-security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        access_log /var/log/nginx/grokbot-machine.log grokbot_machine;
        try_files $uri =404;
    }

    # Hashed, immutable assets.
    location /_astro/ {
        include /etc/nginx/snippets/grokbot-security-headers.conf;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # HTML pages — Astro pretty URLs (dir/index.html).
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/grokbot-security-headers.conf;
        internal;
    }
}
