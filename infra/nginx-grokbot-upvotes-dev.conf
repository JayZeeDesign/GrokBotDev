# grokbot upvotes review vhost — DEV BOX ONLY (feat/upvotes). Do not deploy to staging/prod.
# Mirrors grokbotdev.anacreon.ai TLS, proxies Astro preview :4382 and votes-api :4390.

limit_req_zone $binary_remote_addr zone=grokbot_upvotes_identity:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=grokbot_upvotes_votes:10m rate=30r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grokbot-upvotes.anacreon.ai;

    ssl_certificate /etc/letsencrypt/live/anacreon.ai-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anacreon.ai-0001/privkey.pem;

    include /opt/projects/grokbotdev-upvotes/infra/security-headers.conf;

    location = /api/v1/identity {
        include /opt/projects/grokbotdev-upvotes/infra/security-headers.conf;
        limit_req zone=grokbot_upvotes_identity burst=3 nodelay;
        proxy_pass http://127.0.0.1:4390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/votes {
        include /opt/projects/grokbotdev-upvotes/infra/security-headers.conf;
        limit_req zone=grokbot_upvotes_votes burst=30 nodelay;
        proxy_pass http://127.0.0.1:4390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/votes/ {
        include /opt/projects/grokbotdev-upvotes/infra/security-headers.conf;
        proxy_pass http://127.0.0.1:4390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/health {
        include /opt/projects/grokbotdev-upvotes/infra/security-headers.conf;
        proxy_pass http://127.0.0.1:4390;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4382;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name grokbot-upvotes.anacreon.ai;
    return 301 https://$host$request_uri;
}
