# grokbot — products-grokbot.crhq.ai (internal preview; mirrors the live grokbot.dev build).
# crhq-main SNI-proxies products-*.crhq.ai -> 2.28.9.79:443, where this explicit server_name
# beats the catch-all. Serves the SAME `current` release symlink the public grokbot.dev vhost
# serves, so the preview and production are always byte-identical.
server {
    listen 80;
    listen [::]:80;
    server_name products-grokbot.crhq.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name products-grokbot.crhq.ai;

    ssl_certificate /etc/ssl/crhq.ai/fullchain.pem;
    ssl_certificate_key /etc/ssl/crhq.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/projects/user/grokbot/current;
    index index.html;

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Astro pretty URLs (dir/index.html).
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
}
