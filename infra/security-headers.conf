# §10.7 — the sitewide security header set.
#
# MANDATORY PLACEMENT: `include` this as the FIRST directive of EVERY `location` block in
# §3.5 and §7.1.5. nginx `add_header` does not inherit into a location that declares any
# `add_header` of its own, so `/api/v1/` and the feeds — which set their own CORS and cache
# headers — would otherwise ship with NONE of these. Every header carries `always` so it is
# present on 4xx/5xx too (the /404.html page and the §3.6 waitlist 502).
#
# GAP CLOSED AT F5 (2026-08-21): this file shipped from M0 carrying only three of the seven
# headers §10.7 specifies — Strict-Transport-Security, X-Frame-Options,
# Cross-Origin-Opener-Policy and, most importantly, the entire Content-Security-Policy were
# absent. No local gate reads deploy-time nginx config, so nothing caught it; it surfaced
# while checking that F5's X embeds were permitted by the CSP. The set below is §10.7's
# table verbatim.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content-Security-Policy — §10.7 verbatim. Notes that must survive an edit:
#   · 'wasm-unsafe-eval' is REQUIRED by Pagefind and may not be removed. Without it, site
#     search dies in production only and passes every local `astro preview` check.
#   · platform.twitter.com + syndication.twitter.com in script-src/script-src-elem and
#     platform.twitter.com / x.com / twitter.com in frame-src are what F5's auto-loaded X
#     embeds need. They were ALREADY in §10.7's table for the click-to-load model — F5
#     changed WHEN the request happens, not WHICH host makes it, so nothing was widened here.
#   · Vemetric uses the bundled npm SDK (§9.7), so no Vemetric script host belongs in
#     script-src — only the ingest host in connect-src.
#   · No 'unsafe-inline' and no nonces in script-src: every island is Astro-bundled to
#     /_astro/*.js and `scripts/audit-scripts.mjs` fails the build if that ever regresses.
#   · www.youtube-nocookie.com in frame-src is F17's DELIBERATE WIDENING, and it is the
#     first new third-party origin admitted to this policy since M0. It is exactly one
#     token. Note what is NOT here and keep it that way:
#       — nothing in script-src / script-src-elem. YouTubeEmbed builds its own <iframe>;
#         the YouTube IFrame Player API is never loaded. Adding
#         https://www.youtube.com/iframe_api later is not a tidy-up, it is a second
#         widening of the strictest directive in this file.
#       — nothing in img-src, and NOT because img-src forbids it: img-src is already
#         `'self' https: data:`, so a poster thumbnail from i.ytimg.com would need no edit
#         here at all. The component declines thumbnails on a PRIVACY argument (the
#         fallback card is also the permanent failure state, so a poster is an image that
#         fails in exactly the case it exists for). If thumbnails ever return, this file
#         will not stop them and the guard will not catch them — the thing that becomes
#         false is the /about privacy copy (CP-125).
#       — youtube.com is NOT a frame-src source. The no-cookie host is the one the privacy
#         copy names, and `src/lib/sources.ts` is the only place a player URL is built, so
#         a second builder cannot quietly point at the wrong host and be blocked in
#         production only.
#   · X-Frame-Options: DENY + frame-ancestors 'none' govern OUR pages being framed; they do
#     not affect the x.com iframes we embed, which are governed by frame-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://platform.twitter.com https://syndication.twitter.com; script-src-elem 'self' https://platform.twitter.com https://syndication.twitter.com; worker-src 'self' blob:; frame-src https://platform.twitter.com https://x.com https://twitter.com https://www.youtube-nocookie.com; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://hub.vemetric.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
